    <script>
      // Accessibility safety net for legacy/dynamic widgets: only add an alt
      // when an image has no alt attribute at all. Existing decorative alt=""
      // values remain untouched.
      (() => {
        const labelImage = (img) => {
          if (!img.hasAttribute('alt')) {
            const src = img.getAttribute('src') || '';
            const name = src.split('/').pop().split('?')[0].replace(/[-_]+/g, ' ').replace(/\.(webp|png|jpe?g|avif|svg)$/i, '').trim();
            img.setAttribute('alt', name ? name.replace(/\bcollegeshine\b/gi, 'CollegeShine') : 'CollegeShine image');
          }
          const size = () => {
            if (!img.hasAttribute('width') && img.naturalWidth) img.setAttribute('width', String(img.naturalWidth));
            if (!img.hasAttribute('height') && img.naturalHeight) img.setAttribute('height', String(img.naturalHeight));
          };
          if (img.complete) size(); else img.addEventListener('load', size, { once: true, passive: true });
        };
        const scan = (root) => {
          if (root && root.matches && root.matches('img')) labelImage(root);
          if (root && root.querySelectorAll) root.querySelectorAll('img').forEach(labelImage);
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => scan(document), { once: true });
        else scan(document);
        new MutationObserver((mutations) => mutations.forEach(m => m.addedNodes.forEach(scan))).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
